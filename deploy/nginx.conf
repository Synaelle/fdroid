# fdroid.synaelle.com: the F-Droid repository, files only, served by the
# host's nginx from the folder fetch.sh keeps. Nothing about a visitor is
# logged. certbot adds the HTTPS part.
server {
    listen 80;
    listen [::]:80;
    server_name fdroid.synaelle.com;
    root /opt/fdroid/site/current;
    access_log off;
    error_log /dev/null crit;
    add_header X-Content-Type-Options nosniff always;

    location = / {
        return 302 /repo/;
    }
    # the indexes change with each app release, the APKs never do
    location ~ ^/repo/(entry\.jar|entry\.json|index[^/]*)$ {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
    }
    location /repo/ {
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=86400" always;
    }
    location / {
        return 404;
    }
}
